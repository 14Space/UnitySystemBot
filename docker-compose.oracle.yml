# ВАРИАНТ ДЛЯ СЕРВЕРА Oracle Cloud (Ampere A1, ARM, БЕЗ видеокарты).
#
# Отличие от обычного docker-compose.yml только в двух вещах:
#   1) НЕТ блока проброса NVIDIA GPU (на Oracle видеокарты нет — Whisper на CPU);
#   2) tmpfs (RAM-диски) поменьше — на сервере 24 ГБ ОЗУ, и большие RAM-диски
#      вместе с моделью Whisper могли бы съесть всю память.
#
# Модель/устройство берутся из .env (на Oracle: WHISPER_DEVICE=cpu,
# WHISPER_MODEL=medium, WHISPER_COMPUTE_TYPE=int8 — см. .env.oracle.example).
#
# Запуск на сервере:
#   docker compose -f docker-compose.oracle.yml up -d --build
name: unitysystem

services:

  # Локальный Telegram Bot API сервер — снимает лимит файлов с 50MB до 2GB
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api
    tmpfs:
      - /tmp/telegram-bot-api:size=4g,mode=1777
    ports:
      - "8081:8081"

  # Сам бот
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./data:/app/data
      - tg-api-data:/var/lib/telegram-bot-api:ro
      - whisper-cache:/cache
    tmpfs:
      - /app/data/downloads:size=4g,mode=1777
    depends_on:
      - telegram-bot-api
    # Блока с NVIDIA GPU здесь НЕТ — на Oracle видеокарты нет, Whisper идёт на CPU.

volumes:
  tg-api-data:
  whisper-cache:
