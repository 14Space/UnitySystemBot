services:

  # Локальный Telegram Bot API сервер — снимает лимит файлов с 50MB до 2GB
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      # Файлы храним в Docker-томе (внутри Linux), а не в папке Windows: имя папки
      # содержит двоеточие (токен), и Windows-монтирование на нём ломает сервер.
      - tg-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  # Сам бот
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./data/downloads:/app/data/downloads
      - ./bot.db:/app/bot.db
      # Тот же том с принятыми файлами (ГС/кружки) — бот в Docker читает их напрямую.
      - tg-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      - telegram-bot-api

volumes:
  tg-api-data:
