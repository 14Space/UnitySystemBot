# Имя проекта — от него зависят имена контейнеров (unitysystem-*) и томов.
# Закреплено явно, чтобы не зависеть от имени папки.
name: unitysystem

# Лимит логов: держим максимум 3 файла по 10 МБ на каждый контейнер (=30 МБ), старое
# Docker стирает сам. Без этого лог-файлы растут без предела и со временем забивают
# диск. Подключаем шаблон к каждому сервису ниже через «logging: *default-logging».
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Локальный Telegram Bot API сервер — снимает лимит файлов с 50MB до 2GB
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # Локальный режим: сервер принимает ПУТЬ к файлу вместо повторной заливки по сети
      # и отдаёт абсолютные пути в getFile (приём ГС это уже умеет, см. _fetch_file).
      TELEGRAM_LOCAL: ${TELEGRAM_LOCAL:-1}
    volumes:
      # Файлы храним в Docker-томе (внутри Linux), а не в папке Windows: имя папки
      # содержит двоеточие (токен), и Windows-монтирование на нём ломает сервер.
      - tg-api-data:/var/lib/telegram-bot-api
    # RAM-диск для рабочей temp-папки: через неё идёт ВЫГРУЗКА (сервер пишет файл сюда,
    # отправляет в Telegram и стирает). Переводим на оперативку — запись выгрузки не
    # попадает на SSD. Папку с принятыми голосовыми (/var/lib) не трогаем — она нужна боту.
      # Тот же RAM-диск с загрузками, что и у бота. Нужен, чтобы отдавать серверу ПУТЬ
      # к файлу вместо повторной заливки по сети: файл и так уже лежит в оперативке.
      - downloads:/app/data/downloads
    tmpfs:
      # mode=1777 — чтобы сервер (работает под uid 101) мог писать в RAM-папку
      - /tmp/telegram-bot-api:size=10g,mode=1777
    ports:
      - "8081:8081"

  # «Выдаватель пропусков» (PO-токенов) для YouTube. Без него YouTube отдаёт HTTP 403
  # на скачивание видео/аудио. Бот ходит к нему по имени сервиса внутри docker-сети
  # (http://bgutil-provider:4416) — наружу порт не публикуем, он нужен только боту.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    logging: *default-logging

  # Сам бот
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Все настройки (WHISPER_*, ADMIN_ID, PROXY_URL, ключи и т.д.) берём из .env —
    # как при запуске на хосте. То, что ниже в environment, имеет приоритет.
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      # Внутри Docker-сети до локального Bot API идём по имени сервиса, не localhost.
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      # Тот же флаг, что и у сервера: бот по нему решает, можно ли отдавать файл ссылкой
      # «file://путь» вместо повторной заливки (см. bot/utils/tg_files.py).
      TELEGRAM_LOCAL: ${TELEGRAM_LOCAL:-1}
      # Сколько «карманов» памяти заводит распределитель. По умолчанию он создаёт
      # по одному на поток и каждый держит своё про запас, из-за чего у долгоживущего
      # процесса память только растёт. Двух достаточно, а возврат системе становится
      # предсказуемым (см. _trim_heap в whisper_transcriber).
      MALLOC_ARENA_MAX: "2"
      # Потолок качества для «Сжатия шортс» (короткая сторона кадра)
      SHORTS_CAP_HEIGHT: ${SHORTS_CAP_HEIGHT:-720}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      # Куда боту ходить за пропусками (PO-токенами) для YouTube.
      POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      # Монтируем всю папку data: downloads, cookies и база unitysystem.db (data/unitysystem.db).
      - ./data:/app/data
      # Тот же том с принятыми файлами (ГС/кружки) — бот в Docker читает их напрямую.
      # Не только на чтение: в локальном режиме сервер сам файлы не удаляет, это делает
      # бот после того, как заберёт свою копию (см. _drop_server_copy).
      - tg-api-data:/var/lib/telegram-bot-api
      # Кэш модели Whisper (~3 ГБ): скачивается один раз, переживает пересборку.
      - whisper-cache:/cache
      # RAM-диск для временных файлов загрузок: пишем в оперативку, а не на SSD —
      # нулевой износ диска и выше скорость. Файлы одноразовые (скачали → отправили →
      # удалили). Это ОБЩИЙ том с telegram-bot-api: сервер читает файл по пути, и
      # видео не заливается в него второй раз по сети.
      - downloads:/app/data/downloads
    depends_on:
      - telegram-bot-api
      - bgutil-provider
    # Проброс видеокарты NVIDIA внутрь контейнера — нужен для расшифровки голосовых.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Именованный том в оперативной памяти. Обычный tmpfs: у каждого контейнера свой и
  # общим быть не может, а такой — один на всех, кто его подключит.
  downloads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10g,mode=1777
  tg-api-data:
  whisper-cache:
